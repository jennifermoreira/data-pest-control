<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Cleanup – Admin Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #0f1623;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }

    .card {
      background: #1a2235;
      border: 1px solid #2d3a52;
      border-radius: 12px;
      padding: 48px 40px;
      width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 40px; height: 40px;
      background: #3b82d4;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .logo h1 {
      font-size: 18px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.3px;
    }

    .logo span {
      font-size: 12px;
      color: #64748b;
      display: block;
      margin-top: 2px;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      background: #0f1623;
      border: 1px solid #2d3a52;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    input[type="password"]:focus { border-color: #3b82d4; }

    .error {
      font-size: 12px;
      color: #f87171;
      margin-top: -14px;
      margin-bottom: 16px;
      display: none;
    }

    .time-group {
      margin-bottom: 28px;
    }

    .time-options {
      display: flex;
      gap: 10px;
    }

    .time-btn {
      flex: 1;
      padding: 12px 0;
      background: #0f1623;
      border: 2px solid #2d3a52;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      text-align: center;
    }

    .time-btn:hover { border-color: #3b82d4; color: #e2e8f0; }

    .time-btn.active {
      border-color: #3b82d4;
      background: rgba(59,130,212,0.12);
      color: #60a5fa;
    }

    .btn-launch {
      width: 100%;
      padding: 13px;
      background: #3b82d4;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.18s, transform 0.1s;
    }

    .btn-launch:hover { background: #2563eb; }
    .btn-launch:active { transform: scale(0.98); }

    .hint {
      font-size: 11px;
      color: #475569;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      <div>
        <h1>DataCleanup</h1>
        <span>Enterprise Admin Console</span>
      </div>
    </div>

    <h2>Admin Sign-In</h2>
    <p class="subtitle">Enter your credentials to configure and launch the game.</p>

    <label for="pwd">Admin Password</label>
    <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password" />
    <p class="error" id="err">Incorrect password. Try again.</p>

    <div class="time-group">
      <label>Game Duration</label>
      <div class="time-options">
        <div class="time-btn" data-val="20">20 sec</div>
        <div class="time-btn active" data-val="30">30 sec</div>
        <div class="time-btn" data-val="45">45 sec</div>
      </div>
    </div>

    <button class="btn-launch" id="launchBtn">Launch Game →</button>
    <p class="hint">Default password: <strong>admin123</strong></p>
  </div>

  <script>
    const ADMIN_PASSWORD = 'admin123';
    let selectedTime = 30;

    document.querySelectorAll('.time-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTime = parseInt(btn.dataset.val);
      });
    });

    document.getElementById('launchBtn').addEventListener('click', () => {
      const pwd = document.getElementById('pwd').value;
      const err = document.getElementById('err');
      if (pwd !== ADMIN_PASSWORD) {
        err.style.display = 'block';
        document.getElementById('pwd').style.borderColor = '#f87171';
        return;
      }
      err.style.display = 'none';
      sessionStorage.setItem('dc_time', selectedTime);
      window.location.href = 'game.html';
    });

    document.getElementById('pwd').addEventListener('input', () => {
      document.getElementById('err').style.display = 'none';
      document.getElementById('pwd').style.borderColor = '';
    });
  </script>
</body>
</html>
